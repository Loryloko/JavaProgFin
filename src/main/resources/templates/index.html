<!DOCTYPE html>
<!-- Aggiunto il name-space sec per far funzionare la sicurezza di Spring -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://thymeleaf.org">

<!-- Fragment head -->
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer" />    
    <title th:text="${title}">Title</title>
</head>
<!-- fine fragment head -->

<body>
    <!-- inizio navbar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Aulab Chronicle</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Struttura della Navbar Corretta, Ripulita dai Duplicati -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li sec:authorize="isAuthenticated && hasRole('ROLE_WRITER')" class="nav-item">
                        <a class="nav-link" href="/articles/create">Crea articolo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/articles">Tutti gli articoli</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <div class="d-flex">
                        <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard admin</a>
                            <div class="mt-1" th:if="${careerRequest > 0}">
                                <i class="fas fa-bell fa-1 pt-2"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${careerRequest}"></span>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item" set:authorize="hasRole('ROLE_REVISOR')">
                        <div class="d-flex">
                            <a class="nav-link" href="/revisor/dashboard">Dashboard revisor</a>
                            <div class="mt-1" th:if="${articlesToBeRevised > 0}">
                                <i class="fas fa-bell fa-1 pt-2"></i>
                                <span class="badge rounded-pill bg-danger text-white px-1" th:text="${articlesToBeRevised}"></span>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item" sec:authoroze="hasRole('ROLE_WRITER')">
                        <a class="nav-link" href="/writer/dashboard">Dashboard writer</a>
                    </li>

                    <!-- Menu Accesso Dinamico -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Accesso
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/register}">Register</a></li>
                            <li sec:authorize="isAnonymous()"><a class="dropdown-item" th:href="@{/login}">Login</a></li>
                            <li sec:authorize="isAuthenticated()"><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </li>
                </ul>
                
                <!-- Testo di Benvenuto visibile solo se l'utente è autenticato -->
                <div class="navbar-text me-3" sec:authorize="isAuthenticated()">
                    Benvenuto: <span th:text="${#authentication.name}">Utente</span>
                </div> 
            </div>
        </div>               
        <form class="d-flex" th:action="@{/articles/search}" method="get">
            <input class="form-control me-2" type="search" placeholder="Search" name="keyword" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </nav>
    <!-- fine navbar -->

    <!-- Footer -->
    <footer th:fragment="footer" class="bg-dark text-white pt-4">
        <div class="container">
            <div class="row justify-content-between">
                <!-- Company Info -->
                <div class="col-md-4 mb-3">
                    <a href="/"><h5>Aulab IT</h5></a>
                </div>
                <!-- Contact Info -->
                <div class="col-md-4 mb-3 text-end">
                    <h5>Lavora con noi</h5>
                    <a th:href="@{/operations/career/request}" class="btn btn-primary">Richiedi</a>
                </div>
            </div>
        </div>
        <div class="bg-secondary text-center py-2">
            <p class="mb-0">&copy; 2024 Aulab Jost. All rights reserved.</p>
        </div>
    </footer>
    <!-- fine del footer -->

    <script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
